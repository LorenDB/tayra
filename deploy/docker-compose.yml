# Same source-build stack as the root docker-compose.yml.
# Prefer the root file. If you use this path:
#   docker compose -f deploy/docker-compose.yml --project-directory . up -d --build

x-api-image: &api_image
  image: funkwhale-tayra-api:local
  pull_policy: never
  build:
    context: ./api
    target: production

services:
  postgres:
    restart: unless-stopped
    env_file: .env
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"
    image: postgres:15-alpine
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    env_file: .env
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data

  api:
    <<: *api_image
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file: .env
    volumes:
      - "${MUSIC_DIRECTORY_SERVE_PATH:-./data/music}:${MUSIC_DIRECTORY_PATH:-/music}:ro"
      - "${MEDIA_HOST_PATH:-./data/media}:${MEDIA_ROOT:-/srv/funkwhale/data/media}"
      - "${STATIC_HOST_PATH:-./data/static}:${STATIC_ROOT:-/srv/funkwhale/data/static}"

  celeryworker:
    <<: *api_image
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - api
    env_file: .env
    command:
      - celery
      - --app=funkwhale_api.taskapp
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERYD_CONCURRENCY:-0}
    environment:
      - C_FORCE_ROOT=true
    volumes:
      - "${MUSIC_DIRECTORY_SERVE_PATH:-./data/music}:${MUSIC_DIRECTORY_PATH:-/music}:ro"
      - "${MEDIA_HOST_PATH:-./data/media}:${MEDIA_ROOT:-/srv/funkwhale/data/media}"

  celerybeat:
    <<: *api_image
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - api
    env_file: .env
    command:
      - celery
      - --app=funkwhale_api.taskapp
      - beat
      - --loglevel=INFO

  front:
    restart: unless-stopped
    image: funkwhale-tayra-front:local
    pull_policy: never
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        FUNKWHALE_URL: ${FUNKWHALE_PROTOCOL:-https}://${FUNKWHALE_HOSTNAME}
    depends_on:
      - api
    env_file: .env
    environment:
      - "NGINX_MAX_BODY_SIZE=${NGINX_MAX_BODY_SIZE:-100M}"
      - "FUNKWHALE_API_HOST=api"
      - "FUNKWHALE_API_PORT=5000"
    volumes:
      - "${MUSIC_DIRECTORY_SERVE_PATH:-./data/music}:${MUSIC_DIRECTORY_PATH:-/music}:ro"
      - "${MEDIA_HOST_PATH:-./data/media}:${MEDIA_ROOT:-/srv/funkwhale/data/media}:ro"
      - "${STATIC_HOST_PATH:-./data/static}:/usr/share/nginx/html/staticfiles:ro"
    ports:
      - "${FUNKWHALE_API_IP:-0.0.0.0}:${FUNKWHALE_API_PORT:-5000}:80"

  typesense:
    restart: unless-stopped
    profiles: [typesense]
    env_file: .env
    image: typesense/typesense:0.24.0
    volumes:
      - ./data/typesense:/data
    command: --data-dir /data --enable-cors
