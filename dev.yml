version: "3"

# Local development compose. Vue front removed — run Tayra separately:
#   flutter run -d chrome --dart-define=FUNKWHALE_URL=http://localhost:5000
# Or build SPA into front/dist and use the production front image.

services:
  # Local dev still defaults to trust/no-auth for convenience. Production
  # docker-compose.yml requires passwords (M5). Prefer passwords here too when
  # exposing ports beyond the internal network.
  postgres:
    env_file:
      - .env.dev
      - .env
    # PostgreSQL ≥12 required (Funkwhale 2.x floor). Prod uses 15.
    # Migrating an existing PG11 data volume: dump → remove volume → restore
    # (see DEPLOY.md "PostgreSQL requirements").
    image: postgres:${POSTGRES_VERSION-15}-alpine
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD:-trust}"
    command: postgres ${POSTGRES_ARGS-}
    volumes:
      - "./data/${COMPOSE_PROJECT_NAME-node1}/postgres:/var/lib/postgresql/data"
    networks:
      - internal

  redis:
    env_file:
      - .env.dev
      - .env
    image: redis:7-alpine
    volumes:
      - "./data/${COMPOSE_PROJECT_NAME-node1}/redis:/data"
    networks:
      - internal

  api:
    env_file:
      - .env.dev
      - .env
    build:
      context: ./api
      target: dev
    volumes:
      - "./api:/app"
    networks:
      - internal
    depends_on:
      - postgres
      - redis

  celeryworker:
    env_file:
      - .env.dev
      - .env
    build:
      context: ./api
      target: dev
    command:
      - celery
      - --app=funkwhale_api.taskapp
      - worker
      - --loglevel=INFO
      # consume the default queue plus the dedicated transcode queue so ffmpeg
      # encodes never starve imports; transcodes run at lower priority
      - --queues=celery,transcode
      - -Q:1=celery
      - -Q:2=transcode
    volumes:
      - "./api:/app"
    networks:
      - internal
    depends_on:
      - postgres
      - redis

  celerybeat:
    env_file:
      - .env.dev
      - .env
    build:
      context: ./api
      target: dev
    command:
      - celery
      - --app=funkwhale_api.taskapp
      - beat
      - --loglevel=INFO
    volumes:
      - "./api:/app"
    networks:
      - internal
    depends_on:
      - postgres
      - redis

  # Optional: serve pre-built Tayra from front/dist
  front:
    profiles: ["front"]
    build:
      context: front
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env.dev
      - .env
    ports:
      - "${VUE_PORT-8080}:80"
    networks:
      - internal
    depends_on:
      - api

networks:
  internal:
