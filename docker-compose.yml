# Tayra monorepo — Funkwhale API + Flutter client (source build)
#
# Quick start:
#   git clone <your-fork-url> tayra
#   cd tayra
#   cp .env.example .env   # edit FUNKWHALE_HOSTNAME, secrets, etc.
#   docker compose up -d --build
#
# Flutter client lives at the repository root (flutter run).
# Run all commands from the **repository root** (where this file lives).

x-api-image: &api_image
  image: funkwhale-tayra-api:local
  pull_policy: never
  build:
    context: ./api
    target: production

services:
  postgres:
    restart: unless-stopped
    env_file: .env
    # M5: password auth only (no trust). Set POSTGRES_PASSWORD in .env.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    image: postgres:15-alpine
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    env_file: .env
    image: redis:7-alpine
    # M5: require a password (set REDIS_PASSWORD in .env).
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --save
      - "60"
      - "1"
    volumes:
      - ./data/redis:/data

  api:
    <<: *api_image
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file: .env
    # M5: process runs as UID 1000 via image entrypoint (su-exec after it
    # fixes bind-mount ownership). Do not set user: here — that skips chown
    # and breaks collectstatic on root-owned data/static.
    volumes:
      - "${MUSIC_DIRECTORY_SERVE_PATH:-./data/music}:${MUSIC_DIRECTORY_PATH:-/music}:ro"
      - "${MEDIA_HOST_PATH:-./data/media}:${MEDIA_ROOT:-/srv/funkwhale/data/media}"
      - "${STATIC_HOST_PATH:-./data/static}:${STATIC_ROOT:-/srv/funkwhale/data/static}"

  celeryworker:
    <<: *api_image
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - api
    env_file: .env
    command:
      - celery
      - --app=funkwhale_api.taskapp
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERYD_CONCURRENCY:-0}
    volumes:
      - "${MUSIC_DIRECTORY_SERVE_PATH:-./data/music}:${MUSIC_DIRECTORY_PATH:-/music}:ro"
      - "${MEDIA_HOST_PATH:-./data/media}:${MEDIA_ROOT:-/srv/funkwhale/data/media}"

  celerybeat:
    <<: *api_image
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - api
    env_file: .env
    command:
      - celery
      - --app=funkwhale_api.taskapp
      - beat
      - --loglevel=INFO

  front:
    restart: unless-stopped
    image: funkwhale-tayra-front:local
    pull_policy: never
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        # Baked into the Flutter SPA at image build time (not runtime).
        FUNKWHALE_URL: ${FUNKWHALE_PROTOCOL:-https}://${FUNKWHALE_HOSTNAME}
    depends_on:
      - api
    env_file: .env
    environment:
      - "NGINX_MAX_BODY_SIZE=${NGINX_MAX_BODY_SIZE:-100M}"
      - "FUNKWHALE_API_HOST=api"
      - "FUNKWHALE_API_PORT=5000"
    volumes:
      - "${MUSIC_DIRECTORY_SERVE_PATH:-./data/music}:${MUSIC_DIRECTORY_PATH:-/music}:ro"
      - "${MEDIA_HOST_PATH:-./data/media}:${MEDIA_ROOT:-/srv/funkwhale/data/media}:ro"
      - "${STATIC_HOST_PATH:-./data/static}:/usr/share/nginx/html/staticfiles:ro"
    ports:
      - "${FUNKWHALE_API_IP:-0.0.0.0}:${FUNKWHALE_API_PORT:-5000}:80"

  typesense:
    restart: unless-stopped
    profiles: [typesense]
    env_file: .env
    image: typesense/typesense:0.24.0
    volumes:
      - ./data/typesense:/data
    command: --data-dir /data --enable-cors
