defaultEntryPoints = ["http", "https"]
[accessLog]
################################################################
# Web / API dashboard (H7)
################################################################
# The Traefik v1 dashboard + API must NOT listen on 0.0.0.0 without auth.
# With the Docker provider enabled, an open API can reconfigure routing and
# effectively drive the mounted docker.sock. Leave the [web] section disabled
# in shared/dev stacks. If you need the dashboard locally, bind loopback only:
#   [web]
#   address = "127.0.0.1:8040"
################################################################
# Docker configuration backend
################################################################
[docker]
domain = "funkwhale.test"
watch = true
exposedbydefault = false

[entryPoints]
  [entryPoints.http]
  address = ":80"
    # [entryPoints.http.redirect]
    entryPoint = "http"
  [entryPoints.https]
  address = ":443"
    # Provide your own certificates here, e.g.:
    # [[entryPoints.https.tls.certificates]]
    # certFile = "/ssl/traefik.crt"
    # keyFile = "/ssl/traefik.key"
