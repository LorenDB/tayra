version: "2.1"

services:
  traefik:
    image: traefik:alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.toml:/traefik.toml
    ports:
      - "80:80"
      - "443:443"
      - "8040:8040"
    networks:
      federation:

networks:
  federation:
    name: federation
    external: true
