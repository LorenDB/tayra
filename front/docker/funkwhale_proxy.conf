# Proxy headers for the front nginx container (edge or behind a trusted LB).
#
# H6: never forward client-supplied X-Forwarded-* values. Build Host/Proto/Port
# from nginx's own connection view ($host / $scheme / $server_port) so Django
# absolute URLs (password reset, OAuth) cannot be poisoned by
# X-Forwarded-Host: evil.example. Aligns with deploy/funkwhale_proxy.conf.
#
# If an outer reverse proxy terminates TLS, configure *that* proxy to set
# correct X-Forwarded-* and ensure only it can reach this container (do not
# pass through untrusted client headers).

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;

proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host:$server_port;
proxy_set_header X-Forwarded-Port $server_port;
proxy_redirect off;

# websocket support
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
