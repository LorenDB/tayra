<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tayra — music player for Funkwhale">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tayra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tayra</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Pre-Flutter splash: AMOLED black + primary accent (#0992F2).
    Shown while WASM/JS assets load; removed by flutter_bootstrap.js on
    flutter-first-frame (external JS only — CSP script-src 'self').
  -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
    }

    #tayra-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.2s ease-out;
    }

    #tayra-splash.tayra-splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #tayra-splash img {
      width: 96px;
      height: 96px;
      margin-bottom: 28px;
      border-radius: 20px;
    }

    #tayra-splash .tayra-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(9, 146, 242, 0.25);
      border-top-color: #0992F2;
      border-radius: 50%;
      animation: tayra-spin 0.85s linear infinite;
    }

    #tayra-splash-status {
      margin-top: 20px;
      min-height: 1.25em;
      font-size: 14px;
      color: #B3B3B3;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #tayra-splash-status.tayra-status-visible {
      opacity: 1;
    }

    @keyframes tayra-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="tayra-splash" role="status" aria-live="polite" aria-label="Loading Tayra">
    <img src="icons/Icon-192.png" alt="Tayra" width="96" height="96">
    <div class="tayra-spinner" aria-hidden="true"></div>
    <div id="tayra-splash-status"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
